<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-id="layout-grid">
  <g data-variant="outline">
    <g data-layer="base" data-role="primary" data-paint="stroke">
      <rect x="4" y="4" width="7" height="7" rx="1.5"/>
      <rect x="13" y="4" width="7" height="7" rx="1.5"/>
      <rect x="4" y="13" width="7" height="7" rx="1.5"/>
      <rect x="13" y="13" width="7" height="7" rx="1.5"/>
    </g>
  </g>
  <g data-variant="solid">
    <g data-layer="base" data-role="primary" data-paint="fill">
      <rect x="3" y="3" width="8" height="8" rx="2"/>
      <rect x="13" y="3" width="8" height="8" rx="2"/>
      <rect x="3" y="13" width="8" height="8" rx="2"/>
      <rect x="13" y="13" width="8" height="8" rx="2"/>
    </g>
  </g>
  <g data-variant="duotone">
    <g data-layer="secondary" data-role="secondary" data-paint="fill">
      <rect x="4" y="4" width="7" height="7" rx="1.5"/>
      <rect x="13" y="13" width="7" height="7" rx="1.5"/>
    </g>
    <g data-layer="base" data-role="primary" data-paint="stroke">
      <rect x="4" y="4" width="7" height="7" rx="1.5"/>
      <rect x="13" y="4" width="7" height="7" rx="1.5"/>
      <rect x="4" y="13" width="7" height="7" rx="1.5"/>
      <rect x="13" y="13" width="7" height="7" rx="1.5"/>
    </g>
  </g>
</svg>
