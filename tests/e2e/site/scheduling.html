<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R3 harness: scheduling</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/dialog.css">
    <link rel="stylesheet" href="/date-input.css">
    <link rel="stylesheet" href="/calendar.css">
    <link rel="stylesheet" href="/date-picker.css">
    <link rel="stylesheet" href="/date-time-picker.css">
    <link rel="stylesheet" href="/recurrence-picker.css">
    <link rel="stylesheet" href="/schedule-picker.css">
    <link rel="stylesheet" href="/business-calendar.css">
    <link rel="stylesheet" href="/scheduler.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/scheduling.js"></script>
  </head>
  <body>
    <main class="demo demo-wide">
      <h1>AbsoluteUI R3 scheduling</h1>
      <section aria-labelledby="scheduler-heading">
        <h2 id="scheduler-heading">Scheduler</h2>
        <div id="scheduler"></div>
        <p>Last event: <output id="last-event">none</output></p>
      </section>
      <section aria-labelledby="pickers-heading" class="demo-pickers">
        <h2 id="pickers-heading">Pickers</h2>
        <form id="form" class="demo-form">
          <div id="schedule"></div>
          <div id="recurrence"></div>
        </form>
      </section>
      <section aria-labelledby="business-heading">
        <h2 id="business-heading">Business calendar</h2>
        <div id="business"></div>
      </section>
    </main>
  </body>
</html>
