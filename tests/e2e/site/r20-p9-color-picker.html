<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P9 harness: Color Picker</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/color-picker.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p9-color-picker.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">Color Picker</h1>
      <section aria-labelledby="h-popup">
        <h2 id="h-popup" class="aui-heading aui-heading--4">Popup</h2>
        <div id="cp-popup"></div>
      </section>
      <section aria-labelledby="h-inline">
        <h2 id="h-inline" class="aui-heading aui-heading--4">Inline with opacity</h2>
        <div id="cp-inline"></div>
      </section>
      <section aria-labelledby="h-states">
        <h2 id="h-states" class="aui-heading aui-heading--4">States</h2>
        <div id="cp-readonly"></div>
        <div id="cp-disabled"></div>
      </section>
      <p>Last change: <output id="cp-log"></output></p>
    </main>
  </body>
</html>
