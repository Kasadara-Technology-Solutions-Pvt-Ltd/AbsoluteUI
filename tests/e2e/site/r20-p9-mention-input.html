<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P9 harness: Mention Input</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/mention-input.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p9-mention-input.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">Mention Input</h1>
      <section aria-labelledby="h-comment">
        <h2 id="h-comment" class="aui-heading aui-heading--4">Comment</h2>
        <div id="mention-comment"></div>
        <p id="mention-output" role="status"></p>
      </section>
      <section aria-labelledby="h-single">
        <h2 id="h-single" class="aui-heading aui-heading--4">Single line</h2>
        <div id="mention-single"></div>
      </section>
      <section aria-labelledby="h-states">
        <h2 id="h-states" class="aui-heading aui-heading--4">States</h2>
        <div id="mention-readonly"></div>
        <div id="mention-disabled"></div>
        <div id="mention-invalid"></div>
      </section>
    </main>
  </body>
</html>
