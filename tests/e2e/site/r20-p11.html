<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P11 harness: special charts</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/candlestick-chart.css">
    <link rel="stylesheet" href="/network-graph.css">
    <link rel="stylesheet" href="/calendar-heatmap.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p11.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P11 charts</h1>
      <section aria-labelledby="h-candle">
        <h2 id="h-candle" class="aui-heading aui-heading--4">Candlestick</h2>
        <div id="candle"></div>
        <p id="candle-log"></p>
      </section>
      <section aria-labelledby="h-network">
        <h2 id="h-network" class="aui-heading aui-heading--4">Network graph</h2>
        <div id="network"></div>
        <p id="network-log"></p>
      </section>
      <section aria-labelledby="h-calendar">
        <h2 id="h-calendar" class="aui-heading aui-heading--4">Calendar heatmap</h2>
        <div id="calendar"></div>
      </section>
    </main>
  </body>
</html>
