<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R13 harness: new components</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/badge.css">
    <link rel="stylesheet" href="/kbd.css">
    <link rel="stylesheet" href="/avatar.css">
    <link rel="stylesheet" href="/avatar-group.css">
    <link rel="stylesheet" href="/fieldset.css">
    <link rel="stylesheet" href="/text-input.css">
    <link rel="stylesheet" href="/collapsible.css">
    <link rel="stylesheet" href="/toggle-group.css">
    <link rel="stylesheet" href="/tag-group.css">
    <link rel="stylesheet" href="/slider.css">
    <link rel="stylesheet" href="/scroll-area.css">
    <link rel="stylesheet" href="/carousel.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r13.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R13 components</h1>
      <section aria-labelledby="h-badges" id="badges">
        <h2 id="h-badges" class="aui-heading aui-heading--4">Badges</h2>
        <p id="badge-row"></p>
        <p id="badge-outline-row"></p>
      </section>
      <section aria-labelledby="h-kbd" id="kbd">
        <h2 id="h-kbd" class="aui-heading aui-heading--4">Keyboard shortcuts</h2>
        <p>Save: <span id="kbd-save"></span></p>
        <p>Palette on macOS: <span id="kbd-apple"></span></p>
        <p>Next row: <span id="kbd-arrow"></span></p>
      </section>
      <section aria-labelledby="h-avatars" id="avatars">
        <h2 id="h-avatars" class="aui-heading aui-heading--4">Avatars</h2>
        <p id="avatar-row"></p>
        <p><span id="avatar-decorative"></span> Grace Hopper commented</p>
        <div id="avatar-group"></div>
      </section>
      <section aria-labelledby="h-fieldset" id="fieldsets">
        <h2 id="h-fieldset" class="aui-heading aui-heading--4">Fieldset</h2>
        <fieldset id="address"><div id="street"></div><div id="city"></div></fieldset>
        <button type="button" id="check-address" class="aui-button aui-button--secondary aui-button--md">Check address</button>
      </section>
      <section aria-labelledby="h-collapsible" id="collapsibles">
        <h2 id="h-collapsible" class="aui-heading aui-heading--4">Collapsible</h2>
        <div id="collapsible-plain"></div>
        <div id="collapsible-bordered"></div>
      </section>
      <section aria-labelledby="h-toggle" id="toggles">
        <h2 id="h-toggle" class="aui-heading aui-heading--4">Toggle buttons</h2>
        <div id="toggle-align"></div>
        <div id="toggle-styles"></div>
        <p>Last change: <span id="toggle-log">none</span></p>
      </section>
      <section aria-labelledby="h-tags" id="tags">
        <h2 id="h-tags" class="aui-heading aui-heading--4">Tags</h2>
        <div id="tags-filters"></div>
        <div id="tags-select"></div>
      </section>
      <section aria-labelledby="h-sliders" id="sliders">
        <h2 id="h-sliders" class="aui-heading aui-heading--4">Sliders</h2>
        <div id="slider-volume"></div>
        <div id="slider-price"></div>
      </section>
      <section aria-labelledby="h-scroll" id="scrolls">
        <h2 id="h-scroll" class="aui-heading aui-heading--4">Scroll area</h2>
        <div id="scroll-notes"></div>
      </section>
      <section aria-labelledby="h-carousel" id="carousels">
        <h2 id="h-carousel" class="aui-heading aui-heading--4">Carousel</h2>
        <section id="carousel-featured"></section>
        <section id="carousel-auto"></section>
      </section>
    </main>
  </body>
</html>
