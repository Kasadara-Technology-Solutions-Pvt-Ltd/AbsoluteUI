<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R3 harness: dashboard</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/dashboard-grid.css">
    <link rel="stylesheet" href="/dashboard-widget.css">
    <link rel="stylesheet" href="/stat-card.css">
    <link rel="stylesheet" href="/sparkline.css">
    <link rel="stylesheet" href="/bar-chart.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/dashboard.js"></script>
  </head>
  <body>
    <main class="demo demo-wide">
      <h1>AbsoluteUI R3 dashboard</h1>
      <div class="demo-row">
        <button type="button" id="toggle-edit" aria-pressed="false">Edit layout</button>
        <button type="button" id="undo">Undo</button>
        <button type="button" id="redo">Redo</button>
      </div>
      <div class="demo-dashboard">
        <div id="catalog"></div>
        <div id="grid">
          <article data-aui-item="revenue"><div id="kpi-revenue"></div></article>
          <article data-aui-item="users"><div id="kpi-users"></div></article>
          <article data-aui-item="tickets"><p>Open tickets by region, this week.</p><div id="tickets-chart"></div></article>
          <article data-aui-item="notes"><p>Release freeze starts Friday. Weekly review moved to Thursday.</p></article>
        </div>
      </div>
      <p>Last event: <output id="last-event">none</output></p>
    </main>
  </body>
</html>
