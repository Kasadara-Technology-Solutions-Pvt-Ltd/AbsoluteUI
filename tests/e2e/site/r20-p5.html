<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P5 harness: chat and prompt input</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/avatar.css">
    <link rel="stylesheet" href="/prompt-input.css">
    <link rel="stylesheet" href="/chat.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p5.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P5: chat</h1>
      <section aria-labelledby="h-chat" id="assistant">
        <h2 id="h-chat" class="aui-heading aui-heading--4">Assistant</h2>
        <div id="chat" class="r20-chat"></div>
        <p>Last event: <span id="chat-log">none</span></p>
      </section>
      <section aria-labelledby="h-transcript" id="transcript-section">
        <h2 id="h-transcript" class="aui-heading aui-heading--4">Transcript</h2>
        <div id="transcript" class="r20-chat r20-chat--short"></div>
      </section>
      <section aria-labelledby="h-prompt" id="prompt-section">
        <h2 id="h-prompt" class="aui-heading aui-heading--4">Prompt input</h2>
        <div id="prompt"></div>
        <p>Last sent: <span id="prompt-log">none</span></p>
      </section>
    </main>
  </body>
</html>
