<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P3 harness: virtual list, splitter, empty state</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/virtual-list.css">
    <link rel="stylesheet" href="/splitter.css">
    <link rel="stylesheet" href="/empty-state.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p3.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P3 components</h1>
      <section aria-labelledby="h-vl" id="virtual-lists">
        <h2 id="h-vl" class="aui-heading aui-heading--4">Virtual lists</h2>
        <div id="vl-people"></div>
        <p id="vl-people-selected"></p>
        <div id="vl-multi"></div>
        <div id="vl-plain"></div>
        <div id="vl-infinite"></div>
      </section>
      <section aria-labelledby="h-split" id="splitters">
        <h2 id="h-split" class="aui-heading aui-heading--4">Splitters</h2>
        <div id="split-main"></div>
        <p id="split-sizes"></p>
        <div id="split-nested"></div>
      </section>
      <section aria-labelledby="h-empty" id="empty-states">
        <h2 id="h-empty" class="aui-heading aui-heading--4">Empty states</h2>
        <div id="empty-search"></div>
        <div id="empty-first"></div>
        <p id="empty-log"></p>
      </section>
    </main>
  </body>
</html>
