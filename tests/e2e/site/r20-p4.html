<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P4 harness: tree view, tree select, command palette</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/kbd.css">
    <link rel="stylesheet" href="/empty-state.css">
    <link rel="stylesheet" href="/tree-view.css">
    <link rel="stylesheet" href="/tree-select.css">
    <link rel="stylesheet" href="/command-palette.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p4.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P4 components</h1>
      <section aria-labelledby="h-tree" id="trees">
        <h2 id="h-tree" class="aui-heading aui-heading--4">Tree views</h2>
        <div id="tree-docs"></div>
        <p id="tree-log"></p>
        <div id="tree-checks"></div>
        <p id="tree-checked"></p>
        <div id="tree-big"></div>
      </section>
      <section aria-labelledby="h-select" id="selects">
        <h2 id="h-select" class="aui-heading aui-heading--4">Tree selects</h2>
        <form id="select-form">
          <div id="select-dept"></div>
          <div id="select-locations"></div>
        </form>
        <p id="select-log"></p>
      </section>
      <section aria-labelledby="h-cmdk" id="palettes">
        <h2 id="h-cmdk" class="aui-heading aui-heading--4">Command palette</h2>
        <div id="cmdk-trigger"></div>
        <div id="cmdk"></div>
        <p id="cmdk-log"></p>
      </section>
    </main>
  </body>
</html>
