<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R3 harness: boards</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/kanban.css">
    <link rel="stylesheet" href="/gantt.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/boards.js"></script>
  </head>
  <body>
    <main class="demo demo-wide">
      <h1>AbsoluteUI R3 boards</h1>
      <section aria-labelledby="kanban-heading">
        <h2 id="kanban-heading">Kanban</h2>
        <div id="kanban"></div>
        <p>Last board event: <output id="last-board">none</output></p>
      </section>
      <section aria-labelledby="gantt-heading">
        <h2 id="gantt-heading">Gantt</h2>
        <div id="gantt"></div>
        <p>Last plan event: <output id="last-plan">none</output></p>
      </section>
    </main>
  </body>
</html>
