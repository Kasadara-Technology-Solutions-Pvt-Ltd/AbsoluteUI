<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P8 harness: diagram</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/diagram.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p8.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P8 diagram</h1>
      <section aria-labelledby="h-view" id="viewer">
        <h2 id="h-view" class="aui-heading aui-heading--4">Viewer</h2>
        <div id="diagram-view"></div>
        <p id="view-log"></p>
      </section>
      <section aria-labelledby="h-edit" id="editor">
        <h2 id="h-edit" class="aui-heading aui-heading--4">Editor</h2>
        <div id="diagram-edit"></div>
        <p id="edit-log"></p>
        <p id="select-log"></p>
      </section>
    </main>
  </body>
</html>
