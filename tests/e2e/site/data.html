<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI harness: pickers, data table, and data grid</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/dialog.css">
    <link rel="stylesheet" href="/date-input.css">
    <link rel="stylesheet" href="/calendar.css">
    <link rel="stylesheet" href="/date-picker.css">
    <link rel="stylesheet" href="/time-picker.css">
    <link rel="stylesheet" href="/date-time-picker.css">
    <link rel="stylesheet" href="/pagination.css">
    <link rel="stylesheet" href="/menu.css">
    <link rel="stylesheet" href="/data-table.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/data.js"></script>
  </head>
  <body>
    <main class="demo">
      <h1>AbsoluteUI R1 pickers and data table</h1>
      <section aria-labelledby="h-pickers">
        <h2 id="h-pickers">Date and time</h2>
        <div class="demo-pickers">
          <div id="calendar"></div>
          <div class="demo-stack">
            <div id="date-picker"></div>
            <div id="time-picker"></div>
            <div id="date-time-picker"></div>
          </div>
        </div>
        <p>Last value: <output id="last-value">none</output></p>
      </section>
      <section aria-labelledby="h-table">
        <h2 id="h-table">Data table</h2>
        <div id="table"></div>
        <p>Selected: <output id="selected">none</output></p>
      </section>
      <section aria-labelledby="h-grid">
        <h2 id="h-grid">Data grid</h2>
        <div class="demo-row">
          <button type="button" id="grid-columns">Columns</button>
          <button type="button" id="grid-export">Export CSV</button>
        </div>
        <div id="grid"></div>
        <p>Grid events: <output id="grid-events">none</output></p>
      </section>
      <section aria-labelledby="h-virtual">
        <h2 id="h-virtual">Virtual rows</h2>
        <div id="virtual" class="demo-virtual"></div>
      </section>
    </main>
  </body>
</html>
