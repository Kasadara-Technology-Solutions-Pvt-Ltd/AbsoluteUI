<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R0 harness</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/dialog.css">
    <link rel="stylesheet" href="/combobox.css">
    <link rel="stylesheet" href="/date-input.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="demo">
      <h1>AbsoluteUI R0 reference components</h1>
      <section aria-labelledby="h-buttons">
        <h2 id="h-buttons">Button</h2>
        <div class="demo-row">
          <button type="button" id="btn-primary">Primary</button>
          <button type="button" id="btn-secondary">Secondary</button>
          <button type="button" id="btn-ghost">Ghost</button>
          <button type="button" id="btn-danger">Delete</button>
          <button type="button" id="btn-loading">Saving</button>
          <button type="button" id="btn-icon"></button>
          <button type="button" id="btn-disabled" disabled>Disabled</button>
        </div>
      </section>
      <section aria-labelledby="h-dialog">
        <h2 id="h-dialog">Dialog</h2>
        <button type="button" id="open-dialog">Open dialog</button>
        <p>Last result: <output id="dialog-result">none</output></p>
      </section>
      <section aria-labelledby="h-combobox">
        <h2 id="h-combobox">Combobox</h2>
        <div id="combobox-host"></div>
      </section>
      <section aria-labelledby="h-date">
        <h2 id="h-date">Date input</h2>
        <div id="date-host"></div>
        <div id="datetime-host"></div>
      </section>
      <section aria-labelledby="h-sanitize">
        <h2 id="h-sanitize">Sanitized content</h2>
        <div id="sanitized"></div>
      </section>
    </main>
  </body>
</html>
