    <link rel="stylesheet" href="/text-input.css">

    <link rel="stylesheet" href="/radio-group.css">
    <link rel="stylesheet" href="/combobox.css">
    <link rel="stylesheet" href="/multi-select.css">
    <link rel="stylesheet" href="/checkbox.css">

  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P7: generated forms</h1>
      <section aria-labelledby="h-schema-form" id="schema-form">
        <h2 id="h-schema-form" class="aui-heading aui-heading--4">Schema Form</h2>
        <div id="sf"></div>
        <pre id="sf-value" role="status" aria-label="Submitted value"></pre>
      </section>
      <section aria-labelledby="h-form-builder" id="form-builder">
        <h2 id="h-form-builder" class="aui-heading aui-heading--4">Form Builder</h2>
        <div id="fb"></div>
        <pre id="fb-value" role="status" aria-label="Builder document"></pre>
      </section>
    </main>
  </body>
