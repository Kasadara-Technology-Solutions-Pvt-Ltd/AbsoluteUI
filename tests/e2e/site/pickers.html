<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R2 harness: advanced date and time pickers</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/dialog.css">
    <link rel="stylesheet" href="/date-input.css">
    <link rel="stylesheet" href="/calendar.css">
    <link rel="stylesheet" href="/date-range-picker.css">
    <link rel="stylesheet" href="/month-picker.css">
    <link rel="stylesheet" href="/year-picker.css">
    <link rel="stylesheet" href="/quarter-picker.css">
    <link rel="stylesheet" href="/duration-picker.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/pickers.js"></script>
  </head>
  <body>
    <main class="demo">
      <h1>AbsoluteUI R2 advanced pickers</h1>
      <section aria-labelledby="h-range">
        <h2 id="h-range">Date range</h2>
        <div class="demo-stack">
          <div id="range-calendar"></div>
          <div id="date-range-picker"></div>
        </div>
      </section>
      <section aria-labelledby="h-periods">
        <h2 id="h-periods">Periods and durations</h2>
        <div class="demo-pickers">
          <div id="month-picker"></div>
          <div id="year-picker"></div>
          <div id="quarter-picker"></div>
          <div id="duration-picker"></div>
        </div>
      </section>
      <p>Last value: <output id="last-value">none</output></p>
    </main>
  </body>
</html>
