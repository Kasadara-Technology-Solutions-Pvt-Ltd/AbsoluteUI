<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 harness: Discussion</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/avatar.css">
    <link rel="stylesheet" href="/mention-input.css">
    <link rel="stylesheet" href="/toggle-group.css">
    <link rel="stylesheet" href="/empty-state.css">
    <link rel="stylesheet" href="/spinner.css">
    <link rel="stylesheet" href="/discussion.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-discussion.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">Discussion</h1>
      <section aria-labelledby="h-thread">
        <h2 id="h-thread" class="aui-heading aui-heading--4">Thread</h2>
        <div id="discussion-thread"></div>
        <p id="discussion-log" role="status"></p>
      </section>
      <section aria-labelledby="h-lazy">
        <h2 id="h-lazy" class="aui-heading aui-heading--4">Lazy replies, read-only</h2>
        <div id="discussion-lazy"></div>
      </section>
      <section aria-labelledby="h-empty">
        <h2 id="h-empty" class="aui-heading aui-heading--4">Empty and states</h2>
        <div id="discussion-empty"></div>
        <div id="discussion-error"></div>
      </section>
    </main>
  </body>
</html>
