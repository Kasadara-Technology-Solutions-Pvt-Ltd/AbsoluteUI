<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R2 harness: upload and authentication UI</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/dialog.css">
    <link rel="stylesheet" href="/progress-bar.css">
    <link rel="stylesheet" href="/file-upload.css">
    <link rel="stylesheet" href="/upload-queue.css">
    <link rel="stylesheet" href="/password-input.css">
    <link rel="stylesheet" href="/password-strength-meter.css">
    <link rel="stylesheet" href="/otp-input.css">
    <link rel="stylesheet" href="/session-warning-dialog.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/upload-auth.js"></script>
  </head>
  <body>
    <main id="main" class="demo">
      <h1>AbsoluteUI R2 upload and authentication UI</h1>
      <section aria-labelledby="h-upload" id="upload-section" class="demo-stack">
        <h2 id="h-upload">Upload</h2>
        <div id="upload"></div>
        <div id="queue"></div>
      </section>
      <form id="sign-in" class="demo-form demo-stack" aria-labelledby="h-sign-in">
        <h2 id="h-sign-in">Sign in</h2>
        <div id="password"></div>
        <div id="code"></div>
        <div class="demo-row"><button type="submit" id="sign-in-submit">Sign in</button></div>
        <p>Result: <output id="sign-in-result">none</output></p>
      </form>
      <section aria-labelledby="h-sign-up" id="sign-up" class="demo-form demo-stack">
        <h2 id="h-sign-up">Choose a password</h2>
        <div id="new-password"></div>
        <div id="strength"></div>
      </section>
      <section aria-labelledby="h-session" class="demo-stack">
        <h2 id="h-session">Session</h2>
        <div class="demo-row"><button type="button" id="open-session">Show session warning</button></div>
        <p>Session: <output id="session-result">active</output></p>
      </section>
    </main>
  </body>
</html>
