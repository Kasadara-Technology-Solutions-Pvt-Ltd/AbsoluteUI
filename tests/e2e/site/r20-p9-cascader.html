<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P9 harness: Cascader</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/cascader.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p9-cascader.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--md">
      <h1 class="aui-heading aui-heading--2">Cascader</h1>
      <section aria-labelledby="h-location">
        <h2 id="h-location" class="aui-heading aui-heading--4">Location</h2>
        <form id="location-form"><div id="location"></div></form>
        <p id="location-log" role="status"></p>
      </section>
      <section aria-labelledby="h-lazy">
        <h2 id="h-lazy" class="aui-heading aui-heading--4">Lazy loading</h2>
        <div id="lazy"></div>
      </section>
      <section aria-labelledby="h-multiple">
        <h2 id="h-multiple" class="aui-heading aui-heading--4">Multiple</h2>
        <div id="multiple"></div>
      </section>
    </main>
  </body>
</html>
