<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P10 harness: code viewer</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/code-viewer.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p10-code-viewer.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P10 code viewer</h1>
      <section aria-labelledby="h-code" id="code">
        <h2 id="h-code" class="aui-heading aui-heading--4">Code</h2>
        <div id="code-ts"></div>
        <p id="code-log"></p>
      </section>
      <section aria-labelledby="h-diff" id="diffs">
        <h2 id="h-diff" class="aui-heading aui-heading--4">Diff</h2>
        <div id="code-diff"></div>
        <p id="diff-log"></p>
      </section>
      <section aria-labelledby="h-big" id="big">
        <h2 id="h-big" class="aui-heading aui-heading--4">Large file</h2>
        <div id="code-big"></div>
      </section>
    </main>
  </body>
</html>
