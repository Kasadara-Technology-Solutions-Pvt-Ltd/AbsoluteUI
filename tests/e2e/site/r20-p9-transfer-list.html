<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P9 harness: Transfer List</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/transfer-list.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p9-transfer-list.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">Transfer List</h1>
      <section aria-labelledby="h-team">
        <h2 id="h-team" class="aui-heading aui-heading--4">Team assignment</h2>
        <form id="team-form"><div id="team"></div></form>
        <p id="team-log" role="status"></p>
      </section>
      <section aria-labelledby="h-large">
        <h2 id="h-large" class="aui-heading aui-heading--4">Large list</h2>
        <div id="large"></div>
      </section>
      <section aria-labelledby="h-readonly">
        <h2 id="h-readonly" class="aui-heading aui-heading--4">Read-only and disabled</h2>
        <div id="readonly"></div>
        <div id="disabled"></div>
      </section>
    </main>
  </body>
</html>
