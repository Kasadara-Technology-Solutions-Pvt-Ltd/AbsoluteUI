<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P10 harness: timeline</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/avatar.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/timeline.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p10-timeline.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P10 timeline</h1>
      <section aria-labelledby="h-activity" id="activity">
        <h2 id="h-activity" class="aui-heading aui-heading--4">Activity</h2>
        <div id="tl-activity"></div>
        <p id="tl-log"></p>
      </section>
      <section aria-labelledby="h-alternate" id="alternate">
        <h2 id="h-alternate" class="aui-heading aui-heading--4">Alternate</h2>
        <div id="tl-alternate"></div>
      </section>
      <section aria-labelledby="h-horizontal" id="horizontal">
        <h2 id="h-horizontal" class="aui-heading aui-heading--4">Milestones</h2>
        <div id="tl-horizontal"></div>
      </section>
      <section aria-labelledby="h-failing" id="failing">
        <h2 id="h-failing" class="aui-heading aui-heading--4">Failing source</h2>
        <div id="tl-failing"></div>
      </section>
    </main>
  </body>
</html>
