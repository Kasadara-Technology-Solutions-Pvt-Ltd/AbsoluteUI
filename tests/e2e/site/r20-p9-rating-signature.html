<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P9 harness: Rating and Signature Pad</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/rating.css">
    <link rel="stylesheet" href="/signature-pad.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p9-rating-signature.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">Rating and Signature Pad</h1>
      <section aria-labelledby="h-rating">
        <h2 id="h-rating" class="aui-heading aui-heading--4">Rating</h2>
        <div id="rating-review"></div>
        <p id="rating-output" role="status"></p>
        <div id="rating-required"></div>
        <div id="rating-display"></div>
        <div id="rating-readonly"></div>
        <div id="rating-disabled"></div>
      </section>
      <section aria-labelledby="h-signature">
        <h2 id="h-signature" class="aui-heading aui-heading--4">Signature Pad</h2>
        <div id="signature-pad"></div>
        <p id="signature-output" role="status"></p>
        <div id="signature-readonly"></div>
      </section>
    </main>
  </body>
</html>
