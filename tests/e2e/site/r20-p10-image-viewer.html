<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P10 harness: image viewer</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/image-viewer.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p10-image-viewer.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P10 image viewer</h1>
      <section aria-labelledby="h-inline" id="inline">
        <h2 id="h-inline" class="aui-heading aui-heading--4">Inline viewer</h2>
        <div id="viewer-inline"></div>
        <p id="inline-log"></p>
      </section>
      <section aria-labelledby="h-lightbox" id="lightbox">
        <h2 id="h-lightbox" class="aui-heading aui-heading--4">Lightbox with crop</h2>
        <div id="lightbox-trigger"></div>
        <div id="viewer-lightbox"></div>
        <p id="lightbox-log"></p>
      </section>
    </main>
  </body>
</html>
