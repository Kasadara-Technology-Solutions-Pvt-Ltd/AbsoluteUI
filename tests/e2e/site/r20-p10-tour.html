<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbsoluteUI R20 P10 harness: tour</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/tour.css">
    <link rel="stylesheet" href="/demo.css">
    <script type="module" src="/r20-p10-tour.js"></script>
  </head>
  <body>
    <main id="main" class="aui-container aui-container--lg">
      <h1 class="aui-heading aui-heading--2">AbsoluteUI R20 P10: Tour</h1>
      <section aria-labelledby="h-dashboard" id="dashboard">
        <h2 id="h-dashboard" class="aui-heading aui-heading--4">Dashboard</h2>
        <div id="toolbar"></div>
        <p id="balance">Leave balance: 12 days</p>
        <p id="tour-log"></p>
      </section>
      <section aria-labelledby="h-far" id="far">
        <h2 id="h-far" class="aui-heading aui-heading--4">Further down</h2>
        <p id="reports">Reports appear here.</p>
      </section>
      <div id="tour"></div>
      <div id="tour-modal"></div>
    </main>
  </body>
</html>
