name: Bug report
description: Something in AbsoluteUI does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **Security vulnerabilities must not be reported here**: use the Security tab's "Report a vulnerability" button or email security@kasadara.com.
        Do not include personal data, credentials, or production data.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@absoluteui/components"
        - "@absoluteui/angular"
        - "@absoluteui/core"
        - "@absoluteui/theme"
        - "@absoluteui/icons"
        - "@absoluteui/helpers"
        - "@absoluteui/utilities"
        - "@absoluteui/mcp"
        - "Documentation or website"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.13.0"
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or module
      placeholder: "data-grid, date-picker, helpers/date, ..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code or steps that show the problem.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and framework
      placeholder: "Chrome 142 on Windows 11, Angular 22.2"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Screenshots, console errors, theme, locale, or a known workaround.
