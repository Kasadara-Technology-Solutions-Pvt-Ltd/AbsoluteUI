name: Feature request
description: Suggest a new component, option, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Search the existing issues first; add your use case to a matching one instead of opening a duplicate.
  - type: input
    id: area
    attributes:
      label: Package, component, or area
      placeholder: "@absoluteui/components data-grid"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Code sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
